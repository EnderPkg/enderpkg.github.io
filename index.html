<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EndPkg – CC:Tweaked Package Registry</title>
  <meta name="description" content="EndPkg – ein offener Paketmanager für CC:Tweaked.">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #10151d; color: #eef2f7; }
    main { max-width: 720px; padding: 3rem 1.5rem; }
    h1 { font-size: clamp(2.5rem, 8vw, 5rem); margin: 0 0 1rem; }
    p { color: #b8c2d0; line-height: 1.7; }
    code { color: #9bd3ff; }
  </style>
</head>
<body>
  <main>
    <h1>EndPkg</h1>
    <p>Ein offener Paketmanager für CC:Tweaked. Pakete werden über deklarierte
    <code>-- #enderpkg</code>-Header erkannt und aus externen Quellen bezogen.</p>
    <p>Die Registry befindet sich in Entwicklung.</p>
  </main>
</body>
</html>
